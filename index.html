<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>هەڵسەنگاندنی رێکار</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6ead2;--card:#fffaf0;--dk:#2a1a0e;--go:#e0ae48;--am:#9b5b22;--tx:#2a1a0e;--mu:#7a6350;--tile:#f1e4cc;--p1:#7b2f8f;--p2:#17716c;--wa:#25D366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d140c;--card:#2a1e14;--tx:#f6ead2;--mu:#c3ab90;--tile:#3a2a1c}}
:root[data-theme="dark"]{--bg:#1d140c;--card:#2a1e14;--tx:#f6ead2;--mu:#c3ab90;--tile:#3a2a1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Arabic",Tahoma,sans-serif}
main{max-width:520px;margin:auto;padding:14px 16px 110px}
.hero{position:relative;background:linear-gradient(150deg,#4a2a10,#9b5b22);color:#fff;border-radius:28px;padding:22px 16px 18px;text-align:center;border:3px solid var(--go);overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:160px;height:160px;border-radius:50%;background:#e0ae4822}
.top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}.logo{flex:0 0 auto;width:72px;height:72px;border-radius:20px;border:3px solid var(--go);object-fit:cover;background:#fff;box-shadow:0 6px 16px #0004}.qr{flex:0 0 auto;display:block;width:72px;height:72px}.qr img{display:block;width:72px;height:72px;border-radius:20px;border:3px solid var(--go);background:#fff;padding:7px;image-rendering:pixelated;box-shadow:0 6px 16px #0004}.mid{flex:1;min-width:0}.since{display:inline-block;margin-top:10px;padding:3px 12px;border-radius:20px;border:1px solid #e0ae4877;color:#f6d58a;font-size:12px;font-weight:700;position:relative;z-index:1}
.hero h1{margin:0 0 4px;font-size:19px;line-height:1.35}.hero .s{color:#f6d58a;font-size:12.5px;line-height:1.5}
.hero .t{margin-top:10px;font-size:15px;font-weight:800}
.br{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;position:relative;z-index:1}
.br button{border:2px solid #ffffff55;background:#ffffff14;color:#fff;border-radius:16px;padding:11px 6px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.br button.b1{background:#7b2f8f30;border-color:#b98bc866}.br button.b2{background:#17716c38;border-color:#7cc1bb66}.br button.on{border:3px solid var(--go);box-shadow:0 4px 12px #0003}.br button.b1.on{background:#7b2f8f99}.br button.b2.on{background:#17716ca6}
.sec{background:var(--card);border-radius:24px;margin-top:14px;box-shadow:0 4px 18px #0001;overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--tile)}
.sh .n{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--dk);color:var(--go);display:grid;place-items:center;font-weight:800}
.sh b{font-size:17px}.sh small{display:block;color:var(--mu);font-size:12.5px;font-weight:600}
.sb{padding:14px 16px 16px}.lbl{font-weight:800;margin:4px 0 8px;font-size:14.5px}.lbl:not(:first-child){margin-top:14px}
.emp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.emp button{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid #7a635033;background:transparent;color:var(--tx);border-radius:18px;padding:10px 4px 8px;font:inherit;font-weight:800;font-size:13px;line-height:1.3;cursor:pointer}
.emp button.on{background:var(--go);color:#2a1a0e;border-color:var(--go);transform:translateY(-2px);box-shadow:0 6px 14px #e0ae4855}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;display:grid;place-items:center;color:#fff;font-size:23px;font-weight:800;border:3px solid #fff;box-shadow:0 2px 8px #0002}
.st{display:flex;justify-content:center;gap:4px;direction:ltr}.st button{border:0;background:none;font-size:42px;line-height:1;color:#d6cfc2;cursor:pointer;padding:0 2px;transition:transform .15s}.st button.f{color:var(--go)}.st button:active{transform:scale(1.2)}
.fw{text-align:center;color:var(--mu);font-size:14px;font-weight:800;min-height:22px;margin-top:2px}
textarea{width:100%;border:0;border-radius:16px;padding:12px;font:inherit;font-size:15px;background:var(--tile);color:var(--tx);min-height:76px;resize:vertical}
.ch{display:flex;flex-wrap:wrap;gap:6px}.ch button{border:2px solid #7a635033;background:transparent;color:var(--tx);border-radius:20px;padding:7px 12px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}.ch button.on{background:var(--dk);color:#f6ead2;border-color:var(--dk)}
.opt{display:inline-block;font-size:11.5px;font-weight:800;color:var(--mu);background:var(--tile);border-radius:10px;padding:1px 8px;margin-inline-start:6px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.go{display:block;width:100%;max-width:488px;margin:auto;border:0;border-radius:20px;padding:15px;font:inherit;font-weight:800;font-size:18px;background:var(--wa);color:#fff;cursor:pointer;box-shadow:0 6px 18px #25d36655}
.go:disabled{opacity:.4;box-shadow:none}.mu{color:var(--mu);font-size:13px;text-align:center;line-height:1.7}
.ok{text-align:center;padding:26px 16px}.ok .big{font-size:64px}
.pv{margin:12px 0;padding:12px 14px;border-radius:16px;background:#2f5f3812;border:2px solid #2f5f3855;color:#24452b;font-size:14px;line-height:1.75}</style></head><body><main id="m"></main><div class="bar" id="bar"></div>
